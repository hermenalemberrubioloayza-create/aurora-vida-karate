name: HU-01 backend and browser tests

on:
  push:
    branches: [main, 'automation/**']
  pull_request:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment for Karate. PROD runs only read-only smoke checks.
        required: true
        type: choice
        default: ephemeral
        options:
          - ephemeral
          - QA
          - DEV
          - PROD

permissions:
  contents: read

concurrency:
  group: hu01-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hu01-tests:
    name: Karate API contract and Playwright E2E
    if: github.event_name != 'workflow_dispatch' || inputs.target_environment == 'ephemeral'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            aurora-vida-playwright/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install API dependencies
        run: npm ci

      - name: Install Playwright dependencies
        working-directory: aurora-vida-playwright
        run: npm ci

      - name: Install Chromium
        working-directory: aurora-vida-playwright
        run: npx playwright install --with-deps chromium

      - name: Run Karate contract tests against ephemeral API
        env:
          PORT: 4000
        shell: bash
        run: |
          node scripts/start-test-server.js > "$RUNNER_TEMP/aurora-api.log" 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/aurora-api.log"
              echo "The ephemeral API process exited before becoming ready."
              exit 1
            fi

            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/aurora-api.log"
            echo "The ephemeral API did not become ready within 30 seconds."
            exit 1
          fi

          mvn --batch-mode --no-transfer-progress test

      - name: Run Playwright E2E tests
        env:
          PORT: 4000
          APP_MODE: test
        run: npm run test:e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu01-test-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/karate-reports/
            target/surefire-reports/
            aurora-vida-playwright/playwright-report/
            aurora-vida-playwright/test-results/

  karate-target-environment:
    name: Karate target environment checks
    if: github.event_name == 'workflow_dispatch' && inputs.target_environment != 'ephemeral'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target_environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Validate target configuration
        shell: bash
        env:
          KARATE_ENV: ${{ inputs.target_environment }}
          AURORA_BASE_URL: ${{ vars.AURORA_BASE_URL }}
          AURORA_HEALTH_URL: ${{ vars.AURORA_HEALTH_URL }}
          AURORA_TEST_SUPPORT_URL: ${{ vars.AURORA_TEST_SUPPORT_URL }}
        run: |
          missing=()
          [[ -n "$AURORA_BASE_URL" ]] || missing+=("AURORA_BASE_URL")
          [[ -n "$AURORA_HEALTH_URL" ]] || missing+=("AURORA_HEALTH_URL")
          if [[ "$KARATE_ENV" != "PROD" && -z "$AURORA_TEST_SUPPORT_URL" ]]; then
            missing+=("AURORA_TEST_SUPPORT_URL")
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Karate environment is not configured::Add these variables to the GitHub Environment $KARATE_ENV: ${missing[*]}"
            exit 1
          fi

          echo "::notice title=Karate target selected::Environment $KARATE_ENV; production only runs read-only smoke tests."

      - name: Run read-only production smoke tests
        if: inputs.target_environment == 'PROD'
        shell: bash
        env:
          KARATE_ENV: ${{ inputs.target_environment }}
          AURORA_BASE_URL: ${{ vars.AURORA_BASE_URL }}
          AURORA_HEALTH_URL: ${{ vars.AURORA_HEALTH_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if ! mvn --batch-mode --no-transfer-progress -Dkarate.env="$KARATE_ENV" -Dtest=ReadOnlySmokeRunner test; then
            echo "::error title=Production smoke tests failed::Review the Karate and Surefire output; no write scenarios were run."
            exit 1
          fi
          echo "::notice title=Production smoke tests passed::Read-only health and catalog checks passed."

      - name: Run full contract tests in QA or DEV
        if: inputs.target_environment == 'QA' || inputs.target_environment == 'DEV'
        shell: bash
        env:
          KARATE_ENV: ${{ inputs.target_environment }}
          AURORA_BASE_URL: ${{ vars.AURORA_BASE_URL }}
          AURORA_HEALTH_URL: ${{ vars.AURORA_HEALTH_URL }}
          AURORA_TEST_SUPPORT_URL: ${{ vars.AURORA_TEST_SUPPORT_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if ! mvn --batch-mode --no-transfer-progress -Dkarate.env="$KARATE_ENV" -Dtest=TestRunner test; then
            echo "::error title=Karate contract tests failed::Review the Karate and Surefire output."
            exit 1
          fi
          echo "::notice title=Karate contract tests passed::The full HU-01 contract suite passed in $KARATE_ENV."

      - name: Upload target environment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu01-karate-${{ inputs.target_environment }}-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/karate-reports/
            target/surefire-reports/
