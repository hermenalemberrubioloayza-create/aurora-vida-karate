name: Pruebas API (Karate)

# Pull Request y push a main → el runner inicia la API de este repositorio y ejecuta Karate.
# Ejecución manual (Actions → Run workflow) → elegir ambiente: efimero, dev, certi o prod.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente contra el que se corren las pruebas'
        type: choice
        default: efimero
        options: [efimero, dev, certi, prod]
      etiquetas:
        description: 'Etiquetas a ejecutar (vacío = todas). Ej.: @smokeTest, @happypath, @negativo, @ca1. En prod se ignora: siempre @readonly'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pruebas-api-${{ github.ref }}
  cancel-in-progress: true

env:
  # Espacio de datos y reloj propio en los ambientes compartidos (header X-Semillero).
  AURORA_SEMILLERO: ${{ vars.AURORA_SEMILLERO || 'karate-hu01' }}

jobs:
  efimero:
    name: Karate · servidor local
    if: github.event_name != 'workflow_dispatch' || inputs.ambiente == 'efimero'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Instalar dependencias de la API
        run: npm ci

      - name: Levantar la API local y ejecutar Karate
        env:
          PORT: 4000
          AURORA_HOST: http://127.0.0.1:4000
          ETIQUETAS: ${{ inputs.etiquetas }}
        run: |
          APP_MODE=test node scripts/start-test-server.js > "$RUNNER_TEMP/aurora-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT

          ready=false
          for intento in $(seq 1 30); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/aurora-api.log"
              echo "::error::El proceso de la API terminó antes de iniciar."
              exit 1
            fi
            if curl -fsS http://127.0.0.1:4000/api/health; then
              echo
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/aurora-api.log"
            echo "::error::La API local no respondió en 30 segundos."
            exit 1
          fi

          {
            echo "### API local"
            echo 'Servidor del repositorio en \`http://127.0.0.1:4000\`'
            echo '```json'
            curl -fsS http://127.0.0.1:4000/api/health
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          OPCIONES=()
          if [ -n "$ETIQUETAS" ]; then OPCIONES+=("-Dkarate.options=--tags $ETIQUETAS"); fi
          mvn --batch-mode --no-transfer-progress test \
            -Dkarate.env=efimero \
            -Dsemillero="$AURORA_SEMILLERO" \
            "${OPCIONES[@]}"

      - name: Logs de la API local
        if: failure()
        run: cat "$RUNNER_TEMP/aurora-api.log"

      - name: Resumen de resultados
        if: always()
        run: bash .github/scripts/resumen-karate.sh

      - name: Publicar reporte de Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-karate-efimero
          path: target/karate-reports/
          if-no-files-found: warn
          retention-days: 14

      # El runner y la API local se descartan al terminar el job.

  remoto:
    name: Karate · ambiente remoto (solo ejecución manual)
    if: github.event_name == 'workflow_dispatch' && inputs.ambiente != 'efimero'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Despertar el servicio (plan gratuito de Render)
        env:
          AMBIENTE: ${{ inputs.ambiente }}
        run: |
          URL="https://aurora-vida-${AMBIENTE}.onrender.com/api/health"
          for intento in $(seq 1 12); do
            if curl -fsS -m 20 "$URL"; then echo; exit 0; fi
            echo "Esperando a que despierte ($intento/12)..."
            sleep 10
          done
          echo "::error::$URL no respondió."
          exit 1

      - name: Ejecutar Karate
        env:
          AMBIENTE: ${{ inputs.ambiente }}
          ETIQUETAS: ${{ inputs.etiquetas }}
        run: |
          OPCIONES=()
          # En PROD no hay soporte de pruebas: solo se corren los escenarios @readonly y se ignoran las etiquetas.
          if [ "$AMBIENTE" = "prod" ]; then
            RUNNER=ReadOnlySmokeRunner
          else
            RUNNER=TestRunner
            if [ -n "$ETIQUETAS" ]; then OPCIONES+=("-Dkarate.options=--tags $ETIQUETAS"); fi
          fi
          mvn --batch-mode --no-transfer-progress test -Dkarate.env="$AMBIENTE" -Dsemillero="$AURORA_SEMILLERO" -Dtest="$RUNNER" "${OPCIONES[@]}"

      - name: Resumen de resultados
        if: always()
        run: bash .github/scripts/resumen-karate.sh

      - name: Publicar reporte de Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-karate-${{ inputs.ambiente }}
          path: target/karate-reports/
          if-no-files-found: warn
          retention-days: 14
