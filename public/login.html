<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef2f8">
    <title>Aurora Vida | Continúa tu cotización</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/login.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Aurora Vida, inicio">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>Aurora Vida</span>
      </a>
      <span class="environment">Ambiente DEV</span>
    </header>
    <main class="login-layout">
      <section class="login-panel" aria-labelledby="login-title">
        <h1 id="login-title">Continúa con tu cotización</h1>
        <p>Para contratar, inicia sesión o crea una cuenta. Esta opción estará disponible próximamente.</p>
        <p class="quote-reference">
          Cotización seleccionada
          <strong id="ingresar-cotizacion-text">Validando cotización…</strong>
        </p>
        <p class="alert" id="ingresar-error-msg" role="alert" hidden></p>
        <a class="back-link" id="ingresar-volver-link" href="/">Volver al cotizador</a>
      </section>
    </main>
    <footer>Aurora Seguros es una empresa ficticia creada para práctica de QA.</footer>
  </body>
</html>
